name: 台股籌碼助理每日更新

on:
  schedule:
    - cron: '0 14 * * 1-5'  # 台灣時間 22:00
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: pip install requests pandas yfinance urllib3

      - name: Create config
        run: |
          cat > config.py << 'PYEOF'
          import os
          BASE_DIR = os.path.dirname(os.path.abspath(__file__))
          DATA_DIR = os.path.join(BASE_DIR, "data")
          DB_PATH  = os.path.join(DATA_DIR, "stock.db")
          os.makedirs(DATA_DIR, exist_ok=True)
          GMAIL_USER     = "${{ secrets.GMAIL_USER }}"
          GMAIL_PASSWORD = "${{ secrets.GMAIL_PASSWORD }}"
          NOTIFY_TO      = "${{ secrets.NOTIFY_TO }}"
          TOP_N          = 5
          CONSEC_DAYS    = 3
          TDCC_WEEKS     = 2
          INST_RATIO_THR = 12.0
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
              "Referer": "https://www.twse.com.tw/"
          }
          PYEOF

      - name: Setup and check date
        run: |
          mkdir -p data
          HOUR=$(date '+%H')
          DOW=$(date '+%u')
          DATE=$(date '+%Y%m%d')
          echo "台灣時間：$(date '+%Y-%m-%d %H:%M') 星期$DOW 小時$HOUR"

          # 若不是 22:00 後（排程時間），往回推一個交易日
          if [ "$HOUR" -lt "18" ]; then
            DATE=$(date -d 'yesterday' '+%Y%m%d')
            DOW=$(date -d 'yesterday' '+%u')
          fi

          # 跳過週末
          if [ "$DOW" = "6" ]; then
            DATE=$(date -d "$DATE - 1 day" '+%Y%m%d')
          elif [ "$DOW" = "7" ]; then
            DATE=$(date -d "$DATE - 2 days" '+%Y%m%d')
          fi

          echo "最近交易日：$DATE"
          echo $DATE > data/trading_date.txt

      - name: Fetch institutional data
        run: |
          DATE=$(cat data/trading_date.txt)
          echo "抓取法人資料：$DATE"
          python fetch_data.py --date $DATE

      - name: Fetch margin data
        run: |
          DATE=$(cat data/trading_date.txt)
          python fetch_margin.py --date $DATE

      - name: Fetch TDCC data
        run: python fetch_tdcc.py

      - name: Run analyzer
        run: python analyzer.py

      - name: Fetch prices
        run: python fetch_price.py

      - name: Send email
        run: python email_notify.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DATE=$(cat data/trading_date.txt)

          # 複製當日資料（帶日期）
          cp data/result.json result.json || true
          cp data/prices.json prices.json || true
          cp data/result.json result_${DATE}.json || true
          cp data/prices.json prices_${DATE}.json || true

          # 只保留最近三天（刪除三天前的舊檔）
          DATE_3AGO=$(date -d '3 days ago' '+%Y%m%d')
          rm -f result_${DATE_3AGO}.json prices_${DATE_3AGO}.json || true

          git add result.json prices.json result_*.json prices_*.json
          git diff --staged --quiet || git commit -m "每日更新：$(date '+%Y-%m-%d')"
          git push --force origin main
